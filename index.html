<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrick Poker Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <div class="brand">♠ PATRICK POKER STATS ♠</div>
        <div class="subtitle">Resultados e evolução no poker</div><!-- Patrick Poker Stats -->
      </div>
      <select id="monthSelect" aria-label="Selecionar mês"></select>
    </header>

    <section class="cards">
      <article class="card">
        <span>🃏 MÃOS NO MÊS</span>
        <strong id="hands">—</strong>
      </article>
      <article class="card">
        <span>💰 LUCRO NO MÊS</span>
        <strong id="profit">—</strong>
      </article>
      <article class="card">
        <span>💵 RAKEBACK</span>
        <strong id="rakeback">—</strong>
      </article>
        <article class="card">
    <span>♠️ LIMITE</span>
    <strong id="limit">NL100</strong>
  </article>
    </section>

    <section class="panel">
      <div class="panel-title">Lucro por dia</div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 900 300" preserveAspectRatio="none"></svg>
      </div>
    </section>



    <section class="panel">
      <div class="panel-title">Histórico mensal</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mês</th>
              <th>Mãos</th>
              <th>Lucro</th>
            </tr>
          </thead>
          <tbody id="monthlyHistory"></tbody>
        </table>
      </div>
    </section>

        <section class="panel">
      <div class="panel-title">Histórico diário</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Mãos</th><th>Lucro</th><th>Rakeback</th><th>Banca</th>
            </tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </section>

    <footer>Patrick Poker Stats</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
